[package]
name = "inventory_kamera"
version = "2.0.0"
edition = "2021"
authors = ["Kaleksanan Bagus <curlyzed.lonely@gmail.com>"]
description = "Ultra-fast, distraction-free Genshin Impact scanner & GOOD exporter"

[dependencies]
# UI Framework
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
egui = "0.31"

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async & Channels
crossbeam-channel = "0.5"

# Utilities
open = "5.3"
directories = "6.0"
strsim = "0.11"

# Networking & Updates
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

# Windows API Interop
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
